<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Kontak</title>

    <style>
        /* Pengaturan halaman */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
            color: #333333;
        }

        /* Bagian contact */
        #contact {
            padding: 40px 20px;
        }

        /* Formulir */
        .contact-form {
            width: 400px;
            margin: 0 auto;
            padding: 24px;
            border: 1px solid #cccccc;
            background-color: white;
            border-radius: 8px;
        }

        .contact-form h2 {
            text-align: center;
            color: #222222;
        }

        /* Kelompok input */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }

        /* Efek saat kotak dipilih */
        .form-group input:focus,
        .form-group textarea:focus {
            background-color: #eef7ff;
            border: 1px solid #0077cc;
            outline: none;
        }

        /* Tombol kirim */
        .btn-submit {
            padding: 10px 20px;
            background-color: #0077cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: #004c80;
        }
    </style>
</head>

<body>

    <section id="contact">
        <form class="contact-form">
            <h2>Hubungi Saya</h2>

            <div class="form-group">
                <label for="nama">Nama</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Masukkan email">
            </div>

            <div class="form-group">
                <label for="pesan">Pesan</label>
                <textarea id="pesan" name="pesan" rows="5" placeholder="Tulis pesan kamu"></textarea>
            </div>

            <button type="submit" class="btn-submit">Kirim Pesan</button>
        </form>
    </section>

</body>
</html>
