<!-- Perhitungan lebar total tanpa box-sizing: 320 + (20 × 2) + (2 × 2) = 364px -->

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Proyek</title>

    <style>
        /* Mengatur box model semua elemen */
        * {
            box-sizing: border-box;
        }

        /* Mengatur tampilan halaman */
        body {
            margin: 0;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        /* Mengatur kartu proyek */
        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid #333333;
            margin: 30px auto;
            background-color: white;
            border-radius: 10px;
        }

        /* Mengatur gambar kartu */
        .card img {
            width: 100%;
            height: 160px;
            display: block;
            object-fit: cover;
        }

        /* Mengatur judul kartu */
        .card h3 {
            color: #222222;
            margin-bottom: 8px;
        }

        /* Mengatur paragraf kartu */
        .card p {
            font-size: 15px;
            line-height: 1.5;
        }

        /* Mengatur tautan kartu */
        .card a {
            color: #0066cc;
            text-decoration: none;
        }

        .card a:hover {
            color: #003366;
            text-decoration: underline;
        }

        /* Mengatur footer */
        footer {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>
    <main>
        <div class="card">
            <img src="../assets/images/smkk-immanuel.jpg" alt="Foto proyek">

            <h3>Proyek Saya</h3>

            <p>
                Saya tertarik mempelajari dunia komputer dan teknologi.
                Saya ingin mengembangkan kemampuan dalam bidang TKJ.
            </p>

            <a href="../index.html">Lihat Proyek</a>
        </div>
    </main>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>
</body>
</html>
