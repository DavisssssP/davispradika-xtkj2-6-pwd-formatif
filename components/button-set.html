
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Set</title>

    <style>
        body {
            background-color: #eeeeee;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h2 {
            color: #222222;
            font-size: 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
        }

        .button-group .btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background-color: blue;
            color: white;
        }

        .btn-secondary {
            background-color: #dddddd;
        }

        .btn-outline {
            background-color: white;
            border: 2px solid rgb(0, 100, 200);
        }

        .btn-send {
            background-color: rgba(0, 150, 100, 0.8);
            color: white;
        }

        .btn-secondary,
        .btn-outline {
            color: #222222;
        }

        .btn-primary:hover {
            background-color: darkblue;
        }

        .btn-secondary:hover {
            background-color: #aaaaaa;
        }

        .btn-outline:hover {
            background-color: rgb(0, 100, 200);
            color: white;
        }

        .btn-send:hover {
            background-color: darkgreen;
        }
    </style>
</head>

<body>

    <main>
        <h2>Kumpulan Tombol</h2>

        <div class="button-group">
            <a href="#" class="btn btn-primary">Lihat Proyek</a>

            <a href="#" class="btn btn-secondary">Unduh CV</a>

            <a href="#" class="btn btn-outline">Hubungi Saya</a>

            <a href="#" class="btn btn-send">Kirim Pesan</a>
        </div>
    </main>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
